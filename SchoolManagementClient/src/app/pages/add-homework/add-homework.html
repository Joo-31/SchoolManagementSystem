<div class="container">
  <div class="form-card">
    <h1>Add New Homework</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Course *</label>
        <select [(ngModel)]="courseId" name="courseId" required>
          <option [ngValue]="null">-- Select Course --</option>
          <option *ngFor="let c of courses" [ngValue]="c.id">{{ c.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label>Title *</label>
        <input type="text" [(ngModel)]="title" name="title" placeholder="e.g., Chapter 3 Assignment" required />
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="description" name="description" rows="3" placeholder="Homework details..."></textarea>
      </div>

      <div class="form-group">
        <label>Link (YouTube, Google Drive, Quiz, etc.) *</label>
        <input type="url" [(ngModel)]="link" name="link" placeholder="https://..." required />
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-save">Add Homework</button>
      </div>
    </form>
  </div>
</div>
