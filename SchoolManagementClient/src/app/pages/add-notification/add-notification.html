<div class="container">
  <div class="form-card">
    <h1>Send New Notification</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="title">Title *</label>
        <input type="text" id="title" [(ngModel)]="title" name="title" placeholder="e.g., Midterm Exams Schedule" required />
      </div>

      <div class="form-group">
        <label for="message">Message *</label>
        <textarea id="message" [(ngModel)]="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
      </div>

      <div class="form-group">
        <label for="targetRole">Send To *</label>
        <select id="targetRole" [(ngModel)]="targetRole" name="targetRole">
          <option value="All">Everyone (Students & Teachers)</option>
          <option value="Student">Students Only</option>
          <option value="Teacher">Teachers Only</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-save">Send Notification</button>
      </div>
    </form>
  </div>
</div>
