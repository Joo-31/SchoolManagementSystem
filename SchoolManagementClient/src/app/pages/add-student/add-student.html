<div class="container">
  <div class="form-card">
    <h1>Add New Student</h1>

    <form (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input
            type="text"
            id="firstName"
            [(ngModel)]="firstName"
            name="firstName"
            placeholder="Enter first name"
            required
          />
        </div>

        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input
            type="text"
            id="lastName"
            [(ngModel)]="lastName"
            name="lastName"
            placeholder="Enter last name"
            required
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Birth Date *</label>
          <div class="date-group">
            <input
              type="number"
              [(ngModel)]="birthYear"
              name="birthYear"
              placeholder="Year"
              min="1900"
              max="2025"
            />
            <input
              type="number"
              [(ngModel)]="birthMonth"
              name="birthMonth"
              placeholder="Month"
              min="1"
              max="12"
            />
            <input
              type="number"
              [(ngModel)]="birthDay"
              name="birthDay"
              placeholder="Day"
              min="1"
              max="31"
            />
          </div>
        </div>
      </div>

                  <div class="form-row">
        <div class="form-group">
          <label for="gender">Gender *</label>
          <select id="gender" [(ngModel)]="gender" name="gender">
            <option [value]="0">Male</option>
            <option [value]="1">Female</option>
          </select>
        </div>

        <div class="form-group">
          <label for="classId">Class *</label>
          <!-- ✅ غيرنا ده لـ select -->
          <select id="classId" [(ngModel)]="classId" name="classId" required>
            <option [ngValue]="null">-- Select Class --</option>
            <option *ngFor="let c of classes" [ngValue]="c.id">
              {{ c.name }} - {{ c.gradeName }}
            </option>
          </select>
        </div>
      </div>
      <!-- ✅ الحقول الجديدة للـ User Account -->
      <div class="form-row">
        <div class="form-group">
          <label for="username">Username *</label>
          <input type="text" id="username" [(ngModel)]="username" name="username" placeholder="Enter username" required />
        </div>

        <div class="form-group">
          <label for="password">Password *</label>
          <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Enter password" required />
        </div>
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-save">Save Student</button>
      </div>
    </form>
  </div>
</div>
