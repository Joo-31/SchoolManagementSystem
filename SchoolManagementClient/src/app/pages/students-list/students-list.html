<div class="container">
  <div class="header">
    <h1>Students List (Total: {{ totalCount }})</h1>
    <a routerLink="/students/add" class="btn-add">+ Add Student</a>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <table *ngIf="!loading && !errorMessage">
    <thead>
      <tr>
        <th>#</th>
        <th>ID</th>
        <th>Full Name</th>
        <th>Age</th>
        <th>Gender</th>
        <th>Class Name</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let student of students; let i = index">
        <td>{{ (pageNumber - 1) * pageSize + i + 1 }}</td>
        <td>{{ student.id }}</td>
        <td>{{ student.fullName }}</td>
        <td>{{ student.age }}</td>
        <td>{{ student.gender }}</td>
        <td>{{ student.className }}</td>
        <td>
          <a [routerLink]="['/students/edit', student.id]" class="btn-edit">Edit</a>
          <button (click)="deleteStudent(student.id)" class="btn-delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && students.length === 0" class="no-data">No students found.</div>

  <!-- ✅ Pagination -->
  <div class="pagination" *ngIf="!loading && totalPages > 1">
    <button 
      class="page-btn" 
      [disabled]="!hasPrevious" 
      (click)="previousPage()">
      ← Previous
    </button>

    <button 
      *ngFor="let page of getPages()" 
      class="page-btn"
      [class.active]="page === pageNumber"
      (click)="goToPage(page)">
      {{ page }}
    </button>

    <button 
      class="page-btn" 
      [disabled]="!hasNext" 
      (click)="nextPage()">
      Next →
    </button>
  </div>
</div>
