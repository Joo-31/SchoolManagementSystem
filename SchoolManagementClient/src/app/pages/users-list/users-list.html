<div class="container">
  <div class="header">
    <h1>Users Management</h1>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>

  <table *ngIf="!loading && users.length > 0">
    <thead>
      <tr>
        <th>#</th>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Linked ID</th>
        <th>Created At</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>
          <span class="role-badge" [ngClass]="user.role.toLowerCase()">
            {{ user.role }}
          </span>
        </td>
        <td>
          <span *ngIf="user.studentId">Student (ID: {{ user.studentId }})</span>
          <span *ngIf="user.teacherId">Teacher (ID: {{ user.teacherId }})</span>
          <span *ngIf="!user.studentId && !user.teacherId">-</span>
        </td>
        <td>{{ user.createdAt | date:'short' }}</td>
        <td>
          <button class="btn-reset" (click)="openResetModal(user)" [disabled]="user.role === 'Admin'">
            🔑 Reset Password
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Modal -->
  <div class="modal-overlay" *ngIf="isResetModalOpen">
    <div class="modal-content">
      <h2>Reset Password</h2>
      <p>User: <strong>{{ selectedUser?.username }}</strong></p>
      
      <div class="form-group">
        <label>New Password</label>
        <div class="input-group">
          <input type="text" [(ngModel)]="newPassword" placeholder="Enter or generate password" />
          <button class="btn-generate" (click)="generatePassword()">🎲 Generate</button>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" (click)="closeResetModal()">Cancel</button>
        <button class="btn-save" (click)="confirmReset()">Save & Show Password</button>
      </div>
    </div>
  </div>
</div>
