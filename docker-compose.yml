services:
  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-SchoolDocker@2026!Secure}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sql-server-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: ./SchoolManagementAPI
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Server=sql-server,1433;Database=SchoolManagementDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SchoolDocker@2026!Secure};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:-DockerDevelopmentSigningKey-ChangeForProduction-2026}"
      Jwt__Issuer: SchoolManagementAPI
      Jwt__Audience: SchoolManagementClient
    ports:
      - "5000:8080"
    depends_on:
      sql-server:
        condition: service_healthy
    volumes:
      - uploads:/app/wwwroot

  client:
    build:
      context: ./SchoolManagementClient
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sql-server-data:
  uploads:
